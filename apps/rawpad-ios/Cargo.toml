[package]
name = "rawpad-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "RawPad: the LightCraft egui UI hosted natively on iPadOS (winit UIKit + egui-wgpu on Metal)"

[lints]
workspace = true

[[bin]]
name = "rawpad"
path = "src/main.rs"

# Everything is iOS-only: on other targets the binary is an empty stub, so the upstream workspace
# (`cargo xtask ci` on Linux/FreeBSD/macOS) builds and tests unchanged.
# the touch-gesture tests (src/touch.rs) run on any host
[dev-dependencies]
egui = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
lightcraft-engine = { workspace = true }
lightcraft-ui-egui = { workspace = true }
lightcraft-sysmem = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raster = { workspace = true }
egui = { workspace = true }
# no clipboard (egui-winit keeps an in-app clipboard on iOS), no X11/Wayland
egui-winit = { version = "0.36", default-features = false, features = ["links"] }
egui-wgpu = { version = "0.36", default-features = false, features = ["winit"] }
# the workspace wgpu carries the Metal backend
wgpu = { workspace = true }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
pollster = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# UIKit bridges (src/native.rs): document picker; same objc2 generation as egui-winit's
objc2 = "0.6"
# blocks for Photos' change requests (src/native.rs)
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSError", "NSObject", "NSString", "NSURL"] }
objc2-ui-kit = { version = "0.3", features = ["UIDocumentPickerViewController", "UIViewController", "UIResponder", "UIView", "block2", "objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType", "UTCoreTypes"] }
